<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>black_lily</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK для показа рекламы за вознаграждение в Telegram Mini Apps -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <script>
    window.ADSGRAM_BLOCK_ID = "56699";

    function patchAdsgram() {
      if (window.Adsgram && !window.Adsgram._isPatched) {
        const origInit = window.Adsgram.init.bind(window.Adsgram);
        window.Adsgram.init = function(opts) {
          opts = opts || {};
          if (!opts.blockId || opts.blockId === "int-0") {
            opts.blockId = window.ADSGRAM_BLOCK_ID || "56699";
          }
          const controller = origInit(opts);
          const origShow = controller.show.bind(controller);
          controller.show = function() {
            return origShow().then(function(result) {
              console.log("[Adsgram] Ad completed, sending reward to Unity:", result);
              var u = window.unityInstance || (typeof unityInstance !== "undefined" ? unityInstance : null);
              if (u && typeof u.SendMessage === "function") {
                try { u.SendMessage("[TelegramSDK]", "OnAdsgramSuccess", "reward"); } catch(e) {}
                try { u.SendMessage("[TelegramSDK]", "OnAdsgramSuccess", ""); } catch(e) {}
                try { u.SendMessage("[PlatformSDK]", "OnAdsgramSuccess", "reward"); } catch(e) {}
                try { u.SendMessage("[PlatformSDK]", "OnAdsgramSuccess", ""); } catch(e) {}
              }
              return result;
            }).catch(function(err) {
              console.warn("[Adsgram] Ad closed or failed:", err);
              var u = window.unityInstance || (typeof unityInstance !== "undefined" ? unityInstance : null);
              if (u && typeof u.SendMessage === "function") {
                try { u.SendMessage("[TelegramSDK]", "OnAdsgramFail", "fail"); } catch(e) {}
                try { u.SendMessage("[TelegramSDK]", "OnAdsgramFail", ""); } catch(e) {}
                try { u.SendMessage("[PlatformSDK]", "OnAdsgramFail", "fail"); } catch(e) {}
                try { u.SendMessage("[PlatformSDK]", "OnAdsgramFail", ""); } catch(e) {}
              }
              throw err;
            });
          };
          return controller;
        };
        window.Adsgram._isPatched = true;
      }
    }
    patchAdsgram();
    document.addEventListener("DOMContentLoaded", patchAdsgram);
    window.addEventListener("load", patchAdsgram);
    if (window.Telegram && window.Telegram.WebApp) {
      try {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        if (Telegram.WebApp.lockOrientation) {
          Telegram.WebApp.lockOrientation();
        }
        if (Telegram.WebApp.disableVerticalSwipes) {
          Telegram.WebApp.disableVerticalSwipes();
        }
      } catch (e) {
        console.warn("Telegram WebApp init:", e);
      }
    }

    // Хелпер показа рекламы Adsgram
    window.ShowAdsgramAd = function(blockId, gameObj, onSuccess, onFail) {
      if (!window.Adsgram) {
        console.warn("[Adsgram] window.Adsgram не загружен, симуляция вознаграждения");
        if (window.unityInstance) window.unityInstance.SendMessage(gameObj, onSuccess);
        return;
      }
      try {
        const adController = window.Adsgram.init({ blockId: blockId });
        adController.show().then((result) => {
          console.log("[Adsgram] Успешный просмотр рекламы:", result);
          if (window.unityInstance) window.unityInstance.SendMessage(gameObj, onSuccess);
        }).catch((err) => {
          console.warn("[Adsgram] Реклама пропущена или ошибка:", err);
          if (window.unityInstance) window.unityInstance.SendMessage(gameObj, onFail);
        });
      } catch (e) {
        console.error("[Adsgram] Ошибка вызова:", e);
        if (window.unityInstance) window.unityInstance.SendMessage(gameObj, onFail);
      }
    };
  </script>

  <script>
    const overlayBackgroundColor = "";
    const progressBarFillColor = "";
    const progressBarBackgroundColor = "";
    const progressBarBorderColor = "";
    const backgroundFileName = "";
  </script>

<style>
  /* Убираем выделение по нажатию клавиш */
  canvas:focus {
      outline: none;
  }

  html, body {
      /* Убираем отступы */
      padding: 0;
      margin: 0;
      /* Отключаем скролл и лонгтап на IOS */
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
      /* Ставим высоту на 100% */
      height: 100%;
  }

  #orientation-warning {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #14100c;
      color: #ede2cf;
      z-index: 999999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      box-sizing: border-box;
  }

  @media screen and (orientation: landscape) and (max-height: 600px) {
      #orientation-warning {
          display: flex;
      }
  }
</style>

</head>

<body class="dark">
  <div id="orientation-warning">
    <div style="font-size: 48px; margin-bottom: 16px;">&#128260;</div>
    <div style="font-size: 20px; font-weight: bold; margin-bottom: 8px;">Пожалуйста, поверните устройство</div>
    <div style="font-size: 14px; opacity: 0.8;">Игра работает только в портретной (вертикальной) ориентации</div>
  </div>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading-cover">
    <!-- Атмосферный фон улицы в тумане -->
    <div class="loader-bg"></div>
    <div class="loader-vignette-top"></div>
    <div class="loader-vignette-bottom"></div>

    <!-- Область пути детектива -->
    <div class="loader-track-area">
      <div class="pavement-line"></div>

      <!-- Контейнер для следов (открывается по мере загрузки) -->
      <div class="footsteps-container">
        <div id="footsteps-reveal" class="footsteps-reveal">
          <svg width="100%" height="36" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="blood-glow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#ff1e1e" flood-opacity="0.8"/>
              </filter>
              <pattern id="footsteps-pattern" width="56" height="36" patternUnits="userSpaceOnUse">
                <!-- Левый след -->
                <ellipse cx="12" cy="11" rx="5.5" ry="3.2" fill="#c41414" transform="rotate(-6 12 11)" filter="url(#blood-glow)"/>
                <ellipse cx="19" cy="10" rx="3.5" ry="2.2" fill="#9e0c0c" transform="rotate(-6 19 10)"/>
                <circle cx="7" cy="12" r="1.2" fill="#d41818" opacity="0.8"/>
                <!-- Правый след -->
                <ellipse cx="40" cy="23" rx="5.5" ry="3.2" fill="#c41414" transform="rotate(6 40 23)" filter="url(#blood-glow)"/>
                <ellipse cx="47" cy="24" rx="3.5" ry="2.2" fill="#9e0c0c" transform="rotate(6 47 24)"/>
                <circle cx="35" cy="22" r="1.2" fill="#d41818" opacity="0.8"/>
              </pattern>
            </defs>
            <rect width="100%" height="36" fill="url(#footsteps-pattern)"/>
          </svg>
        </div>
      </div>

      <!-- Идущий силуэт детектива -->
      <div id="detective-mover" class="detective-mover">
        <svg class="detective-svg" viewBox="0 0 70 120" xmlns="http://www.w3.org/2000/svg">
          <!-- Шляпа федора -->
          <ellipse cx="40" cy="16" rx="20" ry="4" fill="#111114" transform="rotate(-8 40 16)"/>
          <path d="M 28 15 C 28 8, 33 5, 42 6 C 50 7, 51 12, 51 15 Z" fill="#18181d"/>
          <rect x="30" y="13" width="20" height="2.5" fill="#32323a"/>
          <!-- Голова и профиль лица -->
          <path d="M 37 17 C 43 18, 47 22, 45 28 C 43 31, 38 32, 34 30 Z" fill="#1d1d23"/>
          <path d="M 45 23 L 49 26 L 44 28 Z" fill="#141418"/>
          <!-- Воротник плаща -->
          <path d="M 30 28 L 46 29 L 51 38 L 42 38 L 36 43 L 28 35 Z" fill="#15151a"/>
          <!-- Плащ и торс -->
          <path d="M 31 35 C 38 35, 48 40, 48 55 C 48 70, 56 82, 54 88 C 50 90, 40 88, 30 88 C 22 84, 18 65, 23 48 C 26 40, 28 36, 31 35 Z" fill="#101014"/>
          <path d="M 42 38 L 47 52 L 40 68 L 38 52 Z" fill="#202027" opacity="0.6"/>
          <!-- Полы плаща -->
          <path d="M 22 62 C 16 72, 12 80, 16 85 C 22 87, 28 86, 30 84 Z" fill="#0d0d10"/>
          <!-- Передняя нога (шаг вперёд) -->
          <path d="M 40 84 L 52 104 L 50 114 L 62 116 L 62 118 L 46 118 L 44 105 L 36 85 Z" fill="#131317"/>
          <!-- Задняя нога (шаг назад) -->
          <path d="M 28 84 L 20 102 L 15 110 L 23 114 L 21 116 L 10 114 L 14 105 L 24 84 Z" fill="#0b0b0e"/>
          <!-- Рука в кармане плаща -->
          <path d="M 35 42 C 42 46, 46 54, 45 62 C 44 68, 41 70, 37 68 C 34 65, 33 55, 33 46 Z" fill="#17171d"/>
        </svg>
      </div>
    </div>

    <!-- Нижняя панель: статус загрузки и барабан револьвера -->
    <div class="loader-footer">
      <div class="loader-status">
        <span class="loader-title">Загрузка...</span>
        <span id="loader-percent" class="loader-percent">0%</span>
      </div>

      <!-- Вращающийся 6-зарядный барабан револьвера -->
      <svg class="revolver-cylinder" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" fill="#23252a" stroke="#484d56" stroke-width="4"/>
        <circle cx="50" cy="50" r="41" fill="none" stroke="#16171a" stroke-width="2"/>
        <circle cx="50" cy="50" r="10" fill="#121316" stroke="#4f545f" stroke-width="3"/>
        <circle cx="50" cy="50" r="4" fill="#6c7382"/>
        <circle cx="50" cy="22" r="9" fill="#0e0f12" stroke="#3e424c" stroke-width="2"/>
        <circle cx="50" cy="22" r="4" fill="#997736" opacity="0.9"/>
        <circle cx="74.2" cy="36" r="9" fill="#0e0f12" stroke="#3e424c" stroke-width="2"/>
        <circle cx="74.2" cy="36" r="4" fill="#997736" opacity="0.9"/>
        <circle cx="74.2" cy="64" r="9" fill="#0e0f12" stroke="#3e424c" stroke-width="2"/>
        <circle cx="74.2" cy="64" r="4" fill="#997736" opacity="0.9"/>
        <circle cx="50" cy="78" r="9" fill="#0e0f12" stroke="#3e424c" stroke-width="2"/>
        <circle cx="50" cy="78" r="4" fill="#997736" opacity="0.9"/>
        <circle cx="25.8" cy="64" r="9" fill="#0e0f12" stroke="#3e424c" stroke-width="2"/>
        <circle cx="25.8" cy="64" r="4" fill="#997736" opacity="0.9"/>
        <circle cx="25.8" cy="36" r="9" fill="#0e0f12" stroke="#3e424c" stroke-width="2"/>
        <circle cx="25.8" cy="36" r="4" fill="#997736" opacity="0.9"/>
      </svg>
    </div>
  </div>

  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Build_Telegram.loader.js";
    const config = {
      dataUrl: buildUrl + "/Build_Telegram.data.unityweb",
      frameworkUrl: buildUrl + "/Build_Telegram.framework.js.unityweb",
      codeUrl: buildUrl + "/Build_Telegram.wasm.unityweb",
      // #if MEMORY_FILENAME
      //   memoryUrl: buildUrl + "/",
      // #endif
      // #if SYMBOLS_FILENAME
      //   symbolsUrl: buildUrl + "/",
      // #endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "black_lily",
      productVersion: "1.0",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    if (overlayBackgroundColor !== " " && overlayBackgroundColor !== ""){
      canvas.style.background = overlayBackgroundColor;
    }

    if (progressBarFillColor !== " " && progressBarFillColor !== ""){
      progressBarFull.style.background = progressBarFillColor;
    }

    if (progressBarBackgroundColor !== " " && progressBarBackgroundColor !== ""){
      progressBarEmpty.style.background = progressBarBackgroundColor;
    }

    if (progressBarBorderColor !== " " && progressBarBorderColor !== ""){
      progressBarEmpty.style.border.color = progressBarBorderColor;
    }

    if (backgroundFileName !== " " && backgroundFileName !== ""){
      canvas.style.background = "url('" + backgroundFileName + "') center / cover";
    }

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    // #if BACKGROUND_FILENAME
    // canvas.style.background = "url('" + buildUrl + "/') center / cover";
    // #endif

    loadingCover.style.display = "";

    // Выключаем появление меню при правом клике мыши
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Возвращаем фокус, если кликнули по экрану
    function FocusGame() {
        window.focus();
        canvas.focus();
    }

    window.addEventListener('pointerdown', () => {
        FocusGame();
    });
    window.addEventListener('touchstart', () => {
        FocusGame();
    });

    function gpExpectedRejectionMessage(reason) {
      if (reason == null) return "";
      if (typeof reason === "string") return reason;
      if (typeof reason === "object")
        return String(reason.code || reason.message || reason);
      return String(reason);
    }

    function isGpExpectedRejection(reason) {
      const message = gpExpectedRejectionMessage(reason).toLowerCase();
      return /cancel last request|user_not_logged_in|payment_rejected|payment_cancelled|purchase_cancelled|cancelled|canceled|cancel|rejected/.test(
        message
      );
    }

    window.addEventListener(
      "unhandledrejection",
      (event) => {
        if (!isGpExpectedRejection(event.reason)) return;
        event.preventDefault();
        event.stopImmediatePropagation();
      },
      true
    );

    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;
    unityLoader.onload = async () => {
      createUnityInstance(canvas, config, (progress) => {
        const pct = Math.min(100, Math.max(0, progress * 100));
        const footsteps = document.getElementById("footsteps-reveal");
        const mover = document.getElementById("detective-mover");
        const percentText = document.getElementById("loader-percent");

        if (footsteps) {
          footsteps.style.clipPath = `inset(0 calc(100% - ${pct}%) 0 0)`;
        }
        if (mover) {
          mover.style.left = `calc(${pct * 0.86}% - 20px)`;
        }
        if (percentText) {
          percentText.textContent = `${Math.round(pct)}%`;
        }
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loadingCover.style.transition = "opacity 0.6s ease";
        loadingCover.style.opacity = "0";
        setTimeout(() => { loadingCover.style.display = "none"; }, 600);
      }).catch((message) => {
        if (isGpExpectedRejection(message)) return;
        alert(message);
      });
    };
    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });

  </script>
</body>

</html>
